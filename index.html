<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- RESPONSIVIDADE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>João Marcos</title>

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #e5e7eb;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;

      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 350px;
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 2px;
      margin: 0;
      position: relative;
    }

    h1::after {
      content: "";
      display: block;
      width: 0;
      height: 2px;
      background: #22c55e;
      margin: 8px auto 0;
      transition: 0.4s;
    }

    h1:hover::after {
      width: 60%;
    }

    .desc {
      font-size: 13px;
      color: #9ca3af;
      margin: 15px 0 35px;
      line-height: 1.6;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .icons a {
      color: #6b7280;
      font-size: 22px;
      transition: 0.3s;
    }

    .icons a:hover {
      color: #22c55e;
      transform: scale(1.3);
      filter: drop-shadow(0 0 5px #22c55e);
    }

    /* 📱 AJUSTES MOBILE */
    @media (max-width: 500px) {
      h1 {
        font-size: 18px;
      }

      .desc {
        font-size: 12px;
      }

      .icons {
        gap: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>João Marcos</h1>

    <div class="desc">
      18 anos <br>
      Análise e Desenvolvimento de Sistemas <br>
      Supervisor Operacional
    </div>

    <div class="icons">
      <a href="https://github.com/joaoomartinssilva2007-lab" target="_blank">
        <i class="fab fa-github"></i>
      </a>

      <a href="https://linkedin.com/in/joao-marcos-martins-silva-673ba63b0/" target="_blank">
        <i class="fab fa-linkedin"></i>
      </a>

      <a href="mailto:joaoo.martins.silva2007@gmail.com">
        <i class="fas fa-envelope"></i>
      </a>
    </div>

  </div>

</body>
</html>
